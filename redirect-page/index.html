<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting to QuickBooks...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      max-width: 420px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; color: #1a1a1a; }
    p  { font-size: 0.95rem; color: #555; margin: 0; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Connecting to QuickBooks…</h1>
    <p id="subtitle">Completing authorization, you can close this tab shortly.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");

    if (error) {
      document.getElementById("title").textContent = "Authorization failed";
      document.getElementById("subtitle").innerHTML =
        `<span class="error">${error}</span><br>You can close this tab and try again.`;
    } else {
      // Forward all query params (code, realmId, state) to the local callback server
      const localUrl = "http://localhost:8085/callback?" + params.toString();
      window.location.href = localUrl;
    }
  </script>
</body>
</html>
